<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyRISC-V Profile and Progress</title>
    <meta
      name="description"
      content="Public StudyRISC-V profile showing badges, XP, lessons completed, quizzes, and recent learning activity."
    />
    <meta property="og:title" content="StudyRISC-V Profile and Progress" />
    <meta property="og:description" content="See public StudyRISC-V progress, badges, and recent activity." />
    <meta property="og:image" content="https://studyriscv.com/og-image.png" />
    <meta property="og:url" content="https://studyriscv.com/profile/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://studyriscv.com/profile/" />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("studyriscv-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
            document.documentElement.dataset.theme = "dark";
          }
        } catch {
          // Ignore theme bootstrap failures.
        }
      })();
    </script>
    <link rel="stylesheet" href="../src/styles/global.css" />
    <link rel="stylesheet" href="../src/styles/nav.css" />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/auth.css" />
    <link rel="stylesheet" href="../src/styles/landing.css" />
    <link rel="stylesheet" href="../src/styles/learn.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon-chip.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  </head>
  <body class="landing-page profile-page">
    <nav id="site-nav"></nav>
    <main class="leaderboard-main">
      <h1 class="sr-only">StudyRISC-V profile and progress</h1>
      <section id="profileApp" class="profile-app"></section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="../src/profile-page.ts"></script>
  </body>
</html>
