<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labs - StudyRISC-V</title>
    <meta
      name="description"
      content="ECE 2035-style StudyRISC-V labs with visible and hidden tests, hints, and graded submissions."
    />
    <meta property="og:title" content="StudyRISC-V Labs" />
    <meta property="og:description" content="ECE 2035-style RISC-V labs with visible tests, hidden checks, and graded feedback." />
    <meta property="og:image" content="https://studyriscv.com/og-image.png" />
    <meta property="og:url" content="https://studyriscv.com/labs/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://studyriscv.com/labs/" />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("studyriscv-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
            document.documentElement.dataset.theme = "dark";
          }
        } catch {
          // ignore theme bootstrap failures
        }
      })();
    </script>
    <link rel="stylesheet" href="../src/styles/global.css" />
    <link rel="stylesheet" href="../src/styles/nav.css" />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/auth.css" />
    <link rel="stylesheet" href="../src/styles/landing.css" />
    <link rel="stylesheet" href="../src/styles/learn.css" />
    <link rel="icon" type="image/svg+xml" href="../favicon-chip.svg" />
  </head>
  <body class="landing-page labs-page">
    <nav id="site-nav"></nav>
    <main class="labs-main">
      <section id="labsApp" class="labs-app"></section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="../src/labs-page.ts"></script>
  </body>
</html>
