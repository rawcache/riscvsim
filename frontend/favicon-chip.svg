<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2d4a"/>
      <stop offset="100%" stop-color="#071828"/>
    </linearGradient>
  </defs>

  <g transform="rotate(12 32 32)">
    <g stroke="#1a7fa8" stroke-width="2.6" stroke-linecap="round" opacity="0.98" fill="none">
      <!-- top -->
      <line x1="18.75" y1="9.5" x2="18.75" y2="3.5"/>
      <line x1="25.375" y1="9.5" x2="25.375" y2="3.5"/>
      <line x1="32" y1="9.5" x2="32" y2="3.5"/>
      <line x1="38.625" y1="9.5" x2="38.625" y2="3.5"/>
      <line x1="45.25" y1="9.5" x2="45.25" y2="3.5"/>

      <!-- bottom -->
      <line x1="18.75" y1="54.5" x2="18.75" y2="60.5"/>
      <line x1="25.375" y1="54.5" x2="25.375" y2="60.5"/>
      <line x1="32" y1="54.5" x2="32" y2="60.5"/>
      <line x1="38.625" y1="54.5" x2="38.625" y2="60.5"/>
      <line x1="45.25" y1="54.5" x2="45.25" y2="60.5"/>

      <!-- left -->
      <line x1="9.5" y1="18.75" x2="3.5" y2="18.75"/>
      <line x1="9.5" y1="25.375" x2="3.5" y2="25.375"/>
      <line x1="9.5" y1="32" x2="3.5" y2="32"/>
      <line x1="9.5" y1="38.625" x2="3.5" y2="38.625"/>
      <line x1="9.5" y1="45.25" x2="3.5" y2="45.25"/>

      <!-- right -->
      <line x1="54.5" y1="18.75" x2="60.5" y2="18.75"/>
      <line x1="54.5" y1="25.375" x2="60.5" y2="25.375"/>
      <line x1="54.5" y1="32" x2="60.5" y2="32"/>
      <line x1="54.5" y1="38.625" x2="60.5" y2="38.625"/>
      <line x1="54.5" y1="45.25" x2="60.5" y2="45.25"/>
    </g>

    <!-- chip body -->
    <rect x="9.5" y="9.5" width="45" height="45" rx="3"
          fill="url(#body)" stroke="#1a7fa8" stroke-width="2.4"/>

    <!-- inner core -->
    <rect x="18.25" y="18.25" width="27.5" height="27.5" rx="1.5"
          fill="#17324a" stroke="#1a7fa8" stroke-width="2"/>
  </g>
</svg>