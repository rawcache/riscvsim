<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Problems - StudyRISC-V</title>
    <meta
      name="description"
      content="Standalone RISC-V assembly problems for StudyRISC-V. Practice in a focused coding workspace with a real editor, testcase console, and submit flow."
    />
    <meta property="og:title" content="StudyRISC-V Problems" />
    <meta
      property="og:description"
      content="Practice RISC-V assembly in a dedicated coding workspace. Read the prompt, write code, run tests, and submit in the browser."
    />
    <meta property="og:image" content="https://studyriscv.com/og-image.png" />
    <meta property="og:url" content="https://studyriscv.com/problems/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://studyriscv.com/problems/" />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("studyriscv-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
            document.documentElement.dataset.theme = "dark";
          }
        } catch {
          // Ignore theme bootstrap failures.
        }
      })();
    </script>
    <link rel="stylesheet" href="../src/styles/global.css" />
    <link rel="stylesheet" href="../src/styles/nav.css" />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/auth.css" />
    <link rel="stylesheet" href="../src/styles/landing.css" />
    <link rel="stylesheet" href="../src/styles/problems.css" />
    <link rel="icon" type="image/svg+xml" href="../favicon-chip.svg" />
  </head>
  <body class="problems-page">
    <nav id="site-nav"></nav>

    <main class="problems-shell" id="problems-shell">
      <section class="pl-layout" id="pl-layout">
        <div class="problems-list-inner">
          <div class="pl-header">
            <div class="pl-header__left">
              <h1 class="pl-header__title">Problems</h1>
              <p class="pl-header__subtitle">Practice RISC-V assembly. No account required.</p>
            </div>
            <div class="pl-header__right">
              <div class="pl-stats">
                <div class="pl-stat">
                  <span class="pl-stat__value" id="pl-stat-solved">0</span>
                  <span class="pl-stat__label">Solved</span>
                </div>
                <div class="pl-stat">
                  <span class="pl-stat__value" id="pl-stat-attempted">0</span>
                  <span class="pl-stat__label">Attempted</span>
                </div>
                <div class="pl-stat">
                  <span class="pl-stat__value" id="pl-stat-total">15</span>
                  <span class="pl-stat__label">Total</span>
                </div>
              </div>
            </div>
          </div>

          <div class="pl-filters" id="pl-filters">
            <div class="pl-search-wrapper">
              <svg class="pl-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
              </svg>
              <input class="pl-search" id="pl-search" type="text" placeholder="Search problems..." autocomplete="off" />
            </div>
            <select class="pl-filter-select" id="pl-difficulty" aria-label="Filter by difficulty">
              <option value="">Difficulty</option>
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
            <select class="pl-filter-select" id="pl-status" aria-label="Filter by status">
              <option value="">Status</option>
              <option value="solved">Solved</option>
              <option value="attempted">Attempted</option>
              <option value="unsolved">Unsolved</option>
            </select>
            <select class="pl-filter-select" id="pl-tag" aria-label="Filter by tag">
              <option value="">Tags</option>
              <option value="Arithmetic">Arithmetic</option>
              <option value="Control Flow">Control Flow</option>
              <option value="Memory">Memory</option>
              <option value="Loops">Loops</option>
              <option value="Functions">Functions</option>
              <option value="Bit Manipulation">Bit Manipulation</option>
              <option value="Arrays">Arrays</option>
              <option value="Strings">Strings</option>
              <option value="Stack">Stack</option>
              <option value="Sorting">Sorting</option>
            </select>
            <button class="pl-filter-clear" id="pl-clear" type="button" hidden>Clear</button>
          </div>

          <div class="pl-table-wrapper">
            <table class="pl-table" id="pl-table">
              <thead>
                <tr>
                  <th class="pl-th pl-th--status"></th>
                  <th class="pl-th pl-th--num">#</th>
                  <th class="pl-th pl-th--title">Title</th>
                  <th class="pl-th pl-th--acceptance">Acceptance</th>
                  <th class="pl-th pl-th--difficulty">Difficulty</th>
                </tr>
              </thead>
              <tbody id="pl-tbody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="pv-layout" id="pv-layout" hidden>
        <header class="pv-topbar" id="pv-topbar">
          <div class="pv-topbar__left">
            <a href="/problems/" class="pv-breadcrumb" id="pv-back-link">Problems</a>
            <span class="pv-breadcrumb__sep">/</span>
            <span class="pv-breadcrumb__difficulty" id="pv-crumb-difficulty">Easy</span>
            <span class="pv-breadcrumb__sep">/</span>
            <span class="pv-breadcrumb__title" id="pv-crumb-title">Add Two Registers</span>
          </div>

          <div class="pv-topbar__center">
            <button class="pv-nav-btn" id="pv-prev" title="Previous problem" type="button" aria-label="Previous problem">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M10 12 6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
            </button>
            <button class="pv-nav-btn" id="pv-next" title="Next problem" type="button" aria-label="Next problem">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="m6 4 4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
            </button>
          </div>

          <div class="pv-topbar__right">
            <span class="pv-timer" id="pv-timer">00:00</span>
            <button class="pv-topbar-icon-btn" id="pv-fullscreen-btn" title="Fullscreen" type="button" aria-label="Toggle fullscreen">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </header>

        <div class="pv-main" id="pv-main">
          <div class="pv-left" id="pv-left">
            <nav class="pv-tabs" role="tablist" aria-label="Problem workspace tabs">
              <button class="pv-tab active" role="tab" data-tab="description" aria-selected="true" type="button">
                Description
              </button>
              <button class="pv-tab" role="tab" data-tab="hints" aria-selected="false" type="button">
                Hints
                <span class="pv-tab__badge" id="pv-hints-badge"></span>
              </button>
              <button class="pv-tab" role="tab" data-tab="editorial" aria-selected="false" type="button">
                Editorial
              </button>
              <button class="pv-tab" role="tab" data-tab="submissions" aria-selected="false" type="button">
                Submissions
              </button>
            </nav>

            <div class="pv-left__body" id="pv-left-body" role="tabpanel"></div>
          </div>

          <div class="pv-divider-v" id="pv-divider-v" role="separator" aria-orientation="vertical">
            <div class="pv-divider-v__line"></div>
          </div>

          <div class="pv-right" id="pv-right">
            <div class="pv-editor-section" id="pv-editor-section">
              <div class="pv-editor-header" id="pv-editor-header">
                <div class="pv-editor-header__left">
                  <span class="pv-editor-label">Code</span>
                  <div class="pv-lang-select" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                      <path d="m4 5 3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                    RISC-V Assembly
                  </div>
                </div>
                <div class="pv-editor-header__right">
                  <button class="pv-editor-btn pv-editor-btn--reset" id="pv-reset-btn" type="button" title="Reset to starter code">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                      <path
                        d="M2 7a5 5 0 1 0 1-3M2 2v3h3"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                    Reset
                  </button>
                  <button class="pv-editor-btn pv-editor-btn--run" id="pv-run-btn" type="button">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                      <path d="M3 2 12 7 3 12V2Z" fill="currentColor" />
                    </svg>
                    Run
                  </button>
                  <button class="pv-editor-btn pv-editor-btn--submit" id="pv-submit-btn" type="button">Submit</button>
                </div>
              </div>

              <div class="pv-monaco-container" id="pv-monaco">
                <div class="pv-monaco-loading" id="pv-monaco-loading">
                  <div class="pv-monaco-loading__spinner"></div>
                  <span>Loading editor...</span>
                </div>
              </div>
            </div>

            <div class="pv-divider-h" id="pv-divider-h" role="separator" aria-orientation="horizontal">
              <div class="pv-divider-h__line"></div>
            </div>

            <div class="pv-console-section" id="pv-console-section">
              <div class="pv-console-header">
                <span class="pv-console-label">Console</span>
                <div class="pv-console-tabs" id="pv-console-tabs">
                  <button class="pv-console-tab active" data-ctab="testcase" type="button">Testcase</button>
                  <button class="pv-console-tab" data-ctab="result" type="button">Test Result</button>
                </div>
                <button class="pv-console-clear" id="pv-console-clear" title="Clear console" type="button">Clear</button>
              </div>

              <div class="pv-console-body" id="pv-console-body"></div>
            </div>
          </div>
        </div>

        <div class="pv-verdict" id="pv-verdict" hidden>
          <div class="pv-verdict__content" id="pv-verdict-content"></div>
          <button class="pv-verdict__close" id="pv-verdict-close" type="button" aria-label="Close verdict banner">×</button>
        </div>

        <div class="pv-reset-confirm" id="pv-reset-confirm" hidden>
          <span>Reset to starter code?</span>
          <button id="pv-reset-cancel" type="button">Cancel</button>
          <button id="pv-reset-ok" type="button">Reset</button>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="../src/problem-list.ts"></script>
  </body>
</html>
