<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>RISC-V Study Groups | StudyRISC-V</title>
    <meta
      name="description"
      content="RISC-V study groups for sharing progress, comparing XP, and staying accountable across lessons, checkpoints, and quizzes."

    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("studyriscv-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
            document.documentElement.dataset.theme = "dark";
          }
        } catch {
          // Ignore theme bootstrap failures.
        }
      })();
    </script>
    <link rel="stylesheet" href="../src/styles/global.css" />
    <link rel="stylesheet" href="../src/styles/nav.css" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />

    <script type="module" src="../src/groups-page.ts"></script>
  </body>
