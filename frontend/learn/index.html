<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn - StudyRISC-V</title>
    <meta
      name="description"
      content="StudyRISC-V guided learning platform with 20 lessons, 15 challenges, labs, quizzes, leaderboard progress, and an ECE 2035-aligned curriculum."
    />
    <meta property="og:title" content="StudyRISC-V — RISC-V Learning Path" />
    <meta property="og:description" content="20 lessons from registers to OS kernels. Built for ECE 2035 at Georgia Tech." />
    <meta property="og:image" content="https://studyriscv.com/og-image.png" />
    <meta property="og:url" content="https://studyriscv.com/learn/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://studyriscv.com/learn/" />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("studyriscv-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
            document.documentElement.dataset.theme = "dark";
          }
        } catch {
          // Ignore theme bootstrap errors.
        }
      })();
    </script>
    <link rel="stylesheet" href="../src/styles/global.css" />
    <link rel="stylesheet" href="../src/styles/nav.css" />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/auth.css" />
    <link rel="stylesheet" href="../src/styles/landing.css" />
    <link rel="stylesheet" href="../src/styles/learn.css" />
    <link rel="icon" type="image/svg+xml" href="../favicon-chip.svg" />
  </head>
  <body class="landing-page learn-page">
    <nav id="site-nav"></nav>

    <main class="learn-shell">
      <section class="learn-hero" id="learnHeroShell"></section>

      <div class="learn-content-wrapper">
        <div class="learn-main">
          <section class="stats-strip" id="learnStatsStrip" aria-label="Learning progress stats"></section>

          <section class="learn-platform">
            <div class="learn-platform__main">
              <section class="learn-panel">
                <div class="learn-panel__header-row">
                  <h2 class="learn-panel__title">Curriculum map</h2>
                  <div class="learn-panel__meta">Follow the learning path from registers to the mini kernel.</div>
                </div>
                <div id="learnCurriculumTree" class="curriculum-tree" aria-live="polite"></div>
              </section>

              <section class="learn-panel learn-panel--summary" id="learnChallengeSummary"></section>
            </div>
          </section>
        </div>

        <aside class="learn-sidebar">
          <div id="leaderboardSidebar" class="leaderboard-sidebar" aria-label="Leaderboard"></div>
          <section id="learnStudyGroups" class="learn-panel learn-study-groups" aria-label="Study groups"></section>
        </aside>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="../src/learn-ui.ts"></script>
  </body>
</html>
