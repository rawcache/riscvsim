<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn - StudyRISC-V</title>
    <meta
      name="description"
      content="Five guided StudyRISC-V lessons covering registers, memory, branches, functions, and sorting for ECE 2035."
    />
    <link rel="canonical" href="https://studyriscv.com/learn/" />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("studyriscv-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
            document.documentElement.dataset.theme = "dark";
          }
        } catch {
          // Ignore storage access failures and fall back to the default theme.
        }
      })();
    </script>
    <link rel="stylesheet" href="../src/styles/global.css" />
    <link rel="stylesheet" href="../src/styles/nav.css" />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/auth.css" />
    <link rel="stylesheet" href="../src/styles/landing.css" />
    <link rel="stylesheet" href="../src/styles/learn.css" />
    <link rel="icon" type="image/svg+xml" href="../favicon-chip.svg" />
  </head>
  <body class="landing-page learn-page">
    <nav id="site-nav"></nav>

    <main class="learn-main">
      <section class="learn-hero">
        <h1 class="learn-hero__title">Learn RISC-V.</h1>
        <p class="learn-hero__subhead">
          Five lessons from zero to sorting algorithms. Built for ECE 2035 at Georgia Tech.
        </p>
        <div id="learnProgressShell" class="learn-progress" hidden>
          <div class="learn-progress__track" aria-hidden="true">
            <div id="learnProgressFill" class="learn-progress__fill"></div>
          </div>
          <div id="learnProgressLabel" class="learn-progress__label">0 of 5 lessons complete</div>
        </div>
      </section>

      <section class="learn-curriculum">
        <div id="learnLessonsList" class="learn-lessons" aria-live="polite"></div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="../src/learn-ui.ts"></script>
  </body>
</html>
