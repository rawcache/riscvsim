<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenges - StudyRISC-V</title>
    <meta
      name="description"
      content="StudyRISC-V challenge set with graded RISC-V assembly practice tied to the guided curriculum."
    />
    <meta property="og:title" content="StudyRISC-V Challenges" />
    <meta property="og:description" content="20 RISC-V assembly coding challenges. From beginner to advanced." />
    <meta property="og:image" content="https://studyriscv.com/og-image.png" />
    <meta property="og:url" content="https://studyriscv.com/challenges/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://studyriscv.com/challenges/" />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("studyriscv-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
            document.documentElement.dataset.theme = "dark";
          }
        } catch {
          // ignore theme bootstrap failures
        }
      })();
    </script>
    <link rel="stylesheet" href="../src/styles/global.css" />
    <link rel="stylesheet" href="../src/styles/nav.css" />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/auth.css" />
    <link rel="stylesheet" href="../src/styles/landing.css" />
    <link rel="stylesheet" href="../src/styles/learn.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon-chip.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  </head>
  <body class="landing-page challenges-page">
    <nav id="site-nav"></nav>

    <main class="challenges-main">
      <section id="weeklyChallengeMount"></section>

      <section class="challenges-header">
        <div>
          <h1 class="challenges-header__title">Challenges</h1>
          <p class="challenges-header__subhead">Independent graded problems tied to every lesson in the curriculum.</p>
        </div>
        <div class="challenges-header__stats">
          <div id="challengesSolved" class="challenges-header__stat">0/15 solved</div>
          <div id="challengesXp" class="challenges-header__stat">0 chips</div>
        </div>
      </section>

      <section class="challenge-filters">
        <div class="challenge-filter-row">
          <button class="challenge-filter is-active" type="button" data-challenge-difficulty="all">All</button>
          <button class="challenge-filter" type="button" data-challenge-difficulty="easy">Easy</button>
          <button class="challenge-filter" type="button" data-challenge-difficulty="medium">Medium</button>
          <button class="challenge-filter" type="button" data-challenge-difficulty="hard">Hard</button>
        </div>
        <select id="challengeLessonFilter" class="challenge-lesson-filter" aria-label="Filter challenges by lesson"></select>
      </section>

      <section id="challengesGrid" class="challenge-grid"></section>
    </main>

    <footer id="site-footer"></footer>
    <script type="module" src="../src/challenges-page.ts"></script>
  </body>
</html>
