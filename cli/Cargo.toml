[package]
name = "riscvsim"
version = "0.1.0"
edition = "2021"
description = "StudyRISC-V terminal simulator: assemble and run RV32IM programs with a full 5-stage pipeline, or serve a live session to the browser UI"

[[bin]]
name = "riscvsim"
path = "src/main.rs"

[dependencies]
sim-engine = { path = "../sim-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
strip = true
