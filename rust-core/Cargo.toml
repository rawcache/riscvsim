[package]
name = "riscvsim-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "riscvsim_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
sim-engine = { path = "../sim-engine" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
